# Render blueprint — works, but read the cost/limits notes before relying on free tiers.
#
# VERIFIED 2026 LIMITS (see README deployment section):
# - Free web services SLEEP after 15 min idle (~1 min wake) and share 750 hrs/mo.
#   A sleeping backend pauses the 30s scheduler until the next request wakes it.
#   For an always-on scheduler use a paid web instance (0.5c-512mb, ~$7/mo).
# - Free Postgres EXPIRES 30 days after creation (+14-day grace, then deleted).
#   For durable $0 data use Neon free (no expiry, scale-to-zero) instead.
# - Free Key Value is in-memory only (25 MB) — BullMQ jobs vanish on restart.
#   For durable $0 Redis use Upstash free (250 MB, persistent).
# Recommended portfolio setup (~$0-7/mo): Vercel web + Render web (free or $7
# always-on) + Neon Postgres + Upstash Redis. Set the secret env vars
# (JWT_SECRET, GOOGLE_API_KEY) in the dashboard — never commit them.
services:
  - type: web
    name: relayops-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: relayops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: relayops-redis
          type: redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://relayops-web.vercel.app
      - key: AI_PROVIDER
        value: gemini
      - key: GOOGLE_API_KEY
        sync: false # set in dashboard
    healthCheckPath: /api/health

  - type: redis
    name: relayops-redis
    ipAllowList: []

databases:
  - name: relayops-db
    databaseName: relayops
    user: relayops
